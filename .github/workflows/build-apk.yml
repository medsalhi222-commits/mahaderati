name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android folder if missing
        run: flutter create . --project-name mahaderati_university --platforms=android

      - name: Configure Android SDK 35 & Kotlin
        run: |
          # ضبط compileSdk و targetSdk إلى 35 في ملف build.gradle.kts أو build.gradle
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk = [0-9]+/compileSdk = 35/' android/app/build.gradle.kts
            sed -i -E 's/targetSdk = [0-9]+/targetSdk = 35/' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 35/' android/app/build.gradle
            sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 35/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK with detailed logs
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
